server:
  port: 0

spring:
  application:
    name: ms-auth
  main:
    allow-circular-references: true
  datasource:
    # For development, using H2 in-memory database
    url: jdbc:h2:mem:auth_db
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

jwt:
  secret: mysecretkey
  expiration: 3600 # in seconds

# OpenTelemetry configuration
management:
  tracing:
    sampling:
      probability: 1.0
  otel:
    config:
      trace:
        sampler: always_on
    traces:
      exporter: otlp
    metrics:
      exporter: prometheus
    logs:
      exporter: none
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always